openapi: 3.1.0
info:
  title: Search service
  description: |
    This is a description of a service that is in charge of recieving the corresponding information
    of the temperatures measured and tries to find any anomaly.
  # Extension for requirements
  x-req:
    $ref: ../REQ/search.yml
  version: 2.0.0
servers:
- url:
- description: Classical machine in wich the service is going to be deployed
- url:
- description: Quantum machine in which the quantum model is going to be executed.
paths:
  /status:
      get:
        summary: Show the status of the service.
        description: Function that returns the availability of the service.
        responses:
          "200":
            description: "Online" 
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    result:
                      type: string
                      description: |
                        The service is online.
          default:
            description: error produced.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    result:
                      type: string
                      description: |
                        An error ocurred.
  /launchSearch/{temperatures_values}:
    get:
      summary: Launch the search algorithim.
      description: Function that execute the search algorithm.
      responses:
        "200":
          description: "OK" 
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: |
                      Search algorithim launched.
        default:
          description: error produced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: |
                      An error occured while launching the analysis.
    parameters:
    - name: temp
      in: paths
      description: Information about temperatures
      required: true
      schema:
        type: array
        items:
          type: string
      style: simple    

  /health:
    get:
      summary: Estado para el monitor interno
      responses:
        "200":
          description: Servicio disponible

  /metrics:
    get:
      summary: Estadisticas operacionales para monitorizar QoS
      responses:
        "200":
          description: Metricas en JSON

  /admin/simulate:
    post:
      summary: Simulacion opcional para pruebas del despliegue
      responses:
        "200":
          description: Configuracion temporal de fallos

# Extension de despliegue: la plataforma no conoce repositorios ni endpoints.
x-deployment:
  port: 8080
  monitoring:
    health_path: /health
    metrics_path: /metrics
    simulation_path: /admin/simulate
  alternatives:
    binarysearch-1:
      components:
      - suffix: ''
        repository:
          url: https://github.com/DavidWindmill/app-a-classical-detector.git
          ref: main
          docker_context: .
    groveralg-1:
      components:
      - suffix: ''
        monitor_metrics: false
        repository:
          url: https://github.com/DavidWindmill/app-a-hybrid-gateway.git
          ref: main
          docker_context: .
        bindings:
          QPU_URL: $id-qpu
      - suffix: -qpu
        repository:
          url: https://github.com/DavidWindmill/app-a-quantum-detector.git
          ref: main
          docker_context: .
