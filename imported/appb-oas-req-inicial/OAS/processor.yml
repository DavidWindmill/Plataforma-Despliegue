openapi: 3.1.0
info:
  title: App B processor
  version: 1.0.0
paths:
  /health:
    get:
      responses:
        '200':
          description: Estado
  /metrics:
    get:
      responses:
        '200':
          description: Metricas QoS
  /admin/simulate:
    post:
      responses:
        '200':
          description: Fallo simulado opcional
x-deployment:
  port: 8080
  monitoring:
    health_path: /health
    metrics_path: /metrics
    simulation_path: /admin/simulate
  alternatives:
    processor-1:
      components:
      - suffix: ''
        repository:
          url: https://github.com/DavidWindmill/app-b-processor.git
          ref: main
          docker_context: .
        environment:
          SERVICE_VARIANT: processor-1
    processor-2:
      components:
      - suffix: ''
        repository:
          url: https://github.com/DavidWindmill/app-b-processor.git
          ref: main
          docker_context: .
        environment:
          SERVICE_VARIANT: processor-2
